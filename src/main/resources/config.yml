# ============================================================================
# PlexonSpawners 3.1.0-rc.1 - Main Configuration
# Paper 26.2 / Java 25 / PlexonCore 2.0.4
# ============================================================================
# High-frequency listeners read compiled runtime snapshots only. Managed-spawner
# persistence is coalesced by one shared coordinator and never writes once per
# placement, break or spawned entity.
# ============================================================================

config-version: 6

managed:
  # Enables the persistent managed-spawner product layer.
  enabled: true

  # One shared persistence coordinator flushes dirty snapshots at this cadence.
  # Range: 20-12000 ticks.
  persistence-interval-ticks: 100

  # Bounded chunk-indexed lookup radius used to attribute SPAWNER spawn events.
  provenance-search-radius: 8

  # Safety bound for individually managed physical spawner blocks in one chunk.
  # WildStacker stacks still represent one physical managed location.
  max-managed-per-chunk: 64

  # Logical nearby-population guard. This is deliberately separate from each
  # tier's native max-nearby-entities value.
  nearby-stack-cap:
    enabled: true
    # Axis-aligned nearby query radius in blocks. Range: 1.0-32.0.
    radius: 8.0
    # Logical population, including WildStacker stack amounts. Range: 1-1000000.
    maximum-amount: 99
    # When true, only the managed spawner's entity type contributes to the cap.
    same-type-only: true

  # OWNER_ONLY -> owner/admin inspect/manage/break
  # PUBLIC_USE -> everyone may inspect; owner/admin manage/break
  # PUBLIC     -> everyone may inspect/break; owner/admin manage
  default-access: OWNER_ONLY

  max-tier: 5

  tiers:
    1:
      label: Initiate
      upgrade-cost-essence: 0
      min-delay: 200
      max-delay: 800
      spawn-count: 4
      max-nearby-entities: 6
      required-player-range: 16
      spawn-range: 4
    2:
      label: Awakened
      upgrade-cost-essence: 16
      min-delay: 180
      max-delay: 700
      spawn-count: 4
      max-nearby-entities: 8
      required-player-range: 18
      spawn-range: 4
    3:
      label: Empowered
      upgrade-cost-essence: 32
      min-delay: 160
      max-delay: 600
      spawn-count: 5
      max-nearby-entities: 10
      required-player-range: 20
      spawn-range: 5
    4:
      label: Ascendant
      upgrade-cost-essence: 48
      min-delay: 140
      max-delay: 520
      spawn-count: 6
      max-nearby-entities: 12
      required-player-range: 22
      spawn-range: 5
    5:
      label: Masterwork
      upgrade-cost-essence: 64
      min-delay: 120
      max-delay: 440
      spawn-count: 7
      max-nearby-entities: 14
      required-player-range: 24
      spawn-range: 6

breaking:
  enabled: true
  take-ownership: true
  required-silk-touch-level: 3
  allow-silk-bypass-permission: false
  drop-spawner-when-qualified: true
  drop-experience: false
  creative-drops: false
  enabled-worlds: []

essence:
  enabled: true
  default-chance: 35.0
  default-amount: 1
  delivery: GROUND

  mob-overrides:
    BLAZE:
      amount: 3
      chance: 30.0
    CREEPER:
      amount: 2
      chance: 35.0
    ENDERMAN:
      amount: 3
      chance: 30.0
    WITHER_SKELETON:
      amount: 4
      chance: 25.0
    IRON_GOLEM:
      amount: 6
      chance: 20.0

  item: null

spawner-item:
  name: '<!italic><gradient:#56B9F2:#92E1FF><b>✦ %mob% Spawner</b></gradient>'
  lore:
    - ''
    - '<!italic><#D8DEE9>A dormant cage bound to the</#D8DEE9>'
    - '<!italic><#D8DEE9>essence of <white>%mob%</white>.</#D8DEE9>'
    - ''
    - '<!italic><#4B5563>› <#8B95A7>Creature</#8B95A7> <white>%mob%</white>'
    - '<!italic><#4B5563>› <#8B95A7>Tier</#8B95A7> <#72F1B8>%tier%</#72F1B8>'
    - '<!italic><#4B5563>› <#8B95A7>State</#8B95A7> <#72F1B8>Ready to Place</#72F1B8>'
    - ''
    - '<!italic><#8B95A7>Place to awaken this spawner.</#8B95A7>'
    - '<!italic><gradient:#C850C0:#FF7EB3>PlexonCraft</gradient> <dark_gray>• Spawner</dark_gray>'

messages:
  break-success-enabled: false
  break-failed-enabled: false
