# ============================================================================
# PlexonSpawners 3.3.0 - Main Configuration
# Paper 26.2 / Java 25 / PlexonCore 2.0.4
# ============================================================================
# PlexonSpawners owns logical spawner stacking. WildStacker remains optional and
# supported for entity/mob stacking only. Disable WildStacker spawner stacking and
# spawner upgrades after the one-time migration has been verified.
# ============================================================================

config-version: 8

managed:
  enabled: true

  # One shared dirty-state persistence coordinator; no per-spawner disk tasks.
  persistence-interval-ticks: 100

  # Bounded chunk-indexed lookup used for managed spawn provenance.
  provenance-search-radius: 8

  # Physical managed-spawner block safety bound. Native logical stack amount does
  # not count as additional physical records.
  max-managed-per-chunk: 64

  nearby-stack-cap:
    enabled: true
    radius: 8.0
    maximum-amount: 99
    same-type-only: true

  redstone-lock:
    enabled: true
    poll-interval-ticks: 20

  stacking:
    enabled: true
    max-stack-size: 64

    auto-stack:
      enabled: true
      vertical:
        enabled: true
        range: 8
      nearby:
        enabled: false
        radius: 1

    compatibility:
      require-same-entity-type: true
      require-same-owner: true
      require-same-tier: true
      require-same-access-mode: true

    display:
      enabled: true
      # User-facing switch: true means no floating stacked-spawner title.
      hide-title: false
      hide-single: true
      format: '<yellow>%entity% Spawner</yellow> <gray>x%amount%</gray>'
      show-tier: true
      tier-format: ' <dark_gray>•</dark_gray> <gray>%tier%</gray>'
      view-distance: 16.0
      vertical-offset: 1.25

    breaking:
      normal-break:
        mode: ONE
      sneak-break:
        mode: ALL
      require-owner: true

    withdraw:
      enabled: true
      presets:
        - 1
        - 8
        - 16

    spawning:
      scale-with-stack: true
      mode: BOUNDED_LINEAR
      max-logical-output-per-cycle: 64
      respect-nearby-logical-cap: true
      # Used only when WildStacker entity stacking is unavailable.
      vanilla-physical-output-cap: 16

    items:
      show-stack-amount: true
      hide-single-amount: true

    creative:
      consume-on-place: false
      drop-on-break: false

    explosions:
      protect-managed-stacks: true

    migration:
      wildstacker:
        enabled: true
        auto-import: true
        warn-if-spawner-stacking-still-enabled: true

  # OWNER_ONLY -> owner/admin inspect/manage/break
  # PUBLIC_USE -> everyone may inspect; owner/admin manage/break
  # PUBLIC     -> everyone may inspect/break; owner/admin manage
  default-access: OWNER_ONLY

  max-tier: 5

  tiers:
    1:
      label: Initiate
      upgrade-cost-essence: 0
      min-delay: 200
      max-delay: 800
      spawn-count: 4
      max-nearby-entities: 6
      required-player-range: 16
      spawn-range: 4
    2:
      label: Awakened
      upgrade-cost-essence: 16
      min-delay: 180
      max-delay: 700
      spawn-count: 4
      max-nearby-entities: 8
      required-player-range: 18
      spawn-range: 4
    3:
      label: Empowered
      upgrade-cost-essence: 32
      min-delay: 160
      max-delay: 600
      spawn-count: 5
      max-nearby-entities: 10
      required-player-range: 20
      spawn-range: 5
    4:
      label: Ascendant
      upgrade-cost-essence: 48
      min-delay: 140
      max-delay: 520
      spawn-count: 6
      max-nearby-entities: 12
      required-player-range: 22
      spawn-range: 5
    5:
      label: Masterwork
      upgrade-cost-essence: 64
      min-delay: 120
      max-delay: 440
      spawn-count: 7
      max-nearby-entities: 14
      required-player-range: 24
      spawn-range: 6

breaking:
  enabled: true
  take-ownership: true
  required-silk-touch-level: 3
  allow-silk-bypass-permission: false
  drop-spawner-when-qualified: true
  drop-experience: false
  creative-drops: false
  enabled-worlds: []

essence:
  enabled: true
  default-chance: 35.0
  default-amount: 1
  delivery: GROUND

  mob-overrides:
    BLAZE:
      amount: 3
      chance: 30.0
    CREEPER:
      amount: 2
      chance: 35.0
    ENDERMAN:
      amount: 3
      chance: 30.0
    WITHER_SKELETON:
      amount: 4
      chance: 25.0
    IRON_GOLEM:
      amount: 6
      chance: 20.0

  item: null

spawner-item:
  name: '<!italic><gradient:#56B9F2:#92E1FF><b>✦ %mob% Spawner</b></gradient>'
  lore:
    - ''
    - '<!italic><#D8DEE9>A dormant cage bound to the</#D8DEE9>'
    - '<!italic><#D8DEE9>essence of <white>%mob%</white>.</#D8DEE9>'
    - ''
    - '<!italic><#4B5563>› <#8B95A7>Creature</#8B95A7> <white>%mob%</white>'
    - '<!italic><#4B5563>› <#8B95A7>Tier</#8B95A7> <#72F1B8>%tier%</#72F1B8>'
    - '<!italic><#4B5563>› <#8B95A7>State</#8B95A7> <#72F1B8>Ready to Place</#72F1B8>'
    - ''
    - '<!italic><#8B95A7>Place to awaken this spawner.</#8B95A7>'
    - '<!italic><gradient:#C850C0:#FF7EB3>PlexonCraft</gradient> <dark_gray>• Spawner</dark_gray>'

messages:
  break-success-enabled: false
  break-failed-enabled: false
