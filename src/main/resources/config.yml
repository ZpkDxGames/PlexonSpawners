# ============================================================================
# PlexonSpawners 2.0.2 - Main Configuration
# ============================================================================
# Most gameplay settings can also be changed in-game with:
#   /pspawners admin
#
# Percentages accept whole numbers and decimals. Examples:
#   0     = never
#   25    = one chance in four on average
#   37.5  = 37.5 percent
#   100   = guaranteed
#
# The core plugin does not require a database. Spawner type information and
# Spawner Essence identity are stored directly on their ItemStacks.
# ============================================================================

config-version: 2

breaking:
  # MASTER SWITCH
  # true  -> PlexonSpawners handles player-broken spawners.
  # false -> The plugin leaves spawner break drops untouched.
  enabled: true

  # AUTHORITATIVE BREAK OWNERSHIP
  # true is strongly recommended when another plugin can also manage spawners.
  #
  # true:
  #   PlexonSpawners claims a valid spawner break at HIGHEST priority, cancels
  #   the original Bukkit break event, completes the break itself, applies tool
  #   durability through Paper's normal damage logic, and produces only the
  #   PlexonSpawners-managed spawner/Essence outcome.
  #
  #   When WildStacker is installed, a stack-safe bridge removes exactly ONE
  #   spawner from the stack instead of deleting the whole physical stack.
  #
  # false:
  #   Uses the legacy 2.0 behavior and leaves the physical break to Bukkit or
  #   another plugin. This may allow another spawner manager to override drops.
  take-ownership: true

  # Minimum Silk Touch enchantment level needed to recover the actual spawner.
  # Example with a value of 3:
  #   Silk Touch III or higher -> the player qualifies for the spawner drop.
  #   Silk Touch II or lower   -> the break is considered a failed recovery and
  #                               may produce Spawner Essence instead.
  # Set to 0 if every valid player break should qualify regardless of the tool.
  # Range: 0-255.
  required-silk-touch-level: 3

  # SILK TOUCH BYPASS PERMISSION
  # false (recommended/default):
  #   The configured Silk Touch level is authoritative for everyone, including
  #   server operators and administrators. Merely being OP does NOT qualify.
  #
  # true:
  #   Players who explicitly have `plexonspawners.bypass.silk` qualify even if
  #   their held tool does not meet required-silk-touch-level.
  #
  # The permission itself is default:false in plugin.yml, so enabling this option
  # still requires you to grant the permission intentionally.
  allow-silk-bypass-permission: false

  # Controls the result after the player DOES meet the Silk Touch requirement.
  # true  -> drop this plugin's typed spawner item, preserving the mob type.
  # false -> destroy the spawner without dropping the spawner item.
  drop-spawner-when-qualified: true

  # Preserve experience generated by the block-break event.
  # false is recommended if you do not want spawner breaking to become an XP
  # farming mechanic.
  drop-experience: false

  # Controls whether players in Creative mode can receive spawner/Essence drops.
  # false -> Creative breaks destroy the spawner and produce no managed drops.
  # true  -> Creative breaks follow the same Silk Touch/Essence rules as normal.
  creative-drops: false

  # Restrict PlexonSpawners break handling to specific worlds.
  # [] means every world is enabled.
  # World names are case-insensitive.
  #
  # Example:
  # enabled-worlds:
  #   - Survival_World
  #   - Survival_World_nether
  #   - Survival_World_the_end
  enabled-worlds: []

essence:
  # MASTER ESSENCE SWITCH
  # When false, failed Silk Touch breaks simply produce no Spawner Essence.
  enabled: true

  # GLOBAL DROP CHANCE
  # This chance is rolled only when the player breaks a spawner without meeting
  # the required Silk Touch level.
  #
  # 0.0   = Essence never drops.
  # 35.0  = 35% chance per failed spawner break.
  # 100.0 = Essence always drops after a failed recovery.
  #
  # A mob-specific value under mob-overrides can replace this chance.
  # Range: 0.0-100.0.
  default-chance: 35.0

  # GLOBAL AMOUNT
  # Number of physical Spawner Essence items delivered when the chance roll
  # succeeds. A mob-specific amount can replace this value.
  # Range: 1-4096.
  default-amount: 1

  # Where successful Essence drops are delivered.
  #
  # GROUND:
  #   Drops the item naturally at the broken spawner's location.
  #
  # INVENTORY:
  #   Attempts to insert the item directly into the player's inventory.
  #   Any overflow is safely dropped at the spawner location.
  delivery: GROUND

  # MOB-SPECIFIC ESSENCE VALUES
  # Any living/spawnable EntityType can have its own amount and/or chance.
  # These values override the global defaults only for that spawner type.
  #
  # You can edit these in-game from:
  #   /pspawners admin -> Mob Values
  #
  # In the Mob Values GUI:
  #   Left / Right Click       -> amount +1 / -1
  #   Shift Left / Right Click -> chance +5% / -5%
  #   Drop key (Q)             -> remove the override and use global defaults
  #
  # You may omit either `amount` or `chance`; the missing value uses the global
  # default. The examples below provide both for clarity.
  mob-overrides:
    BLAZE:
      amount: 3
      chance: 30.0
    CREEPER:
      amount: 2
      chance: 35.0
    ENDERMAN:
      amount: 3
      chance: 30.0
    WITHER_SKELETON:
      amount: 4
      chance: 25.0
    IRON_GOLEM:
      amount: 6
      chance: 20.0

  # CANONICAL ESSENCE ITEM
  # The in-game editor stores the exact Bukkit ItemStack here after an admin
  # chooses "Set Essence From Hand". Name, lore, model data and other metadata
  # are preserved, then PlexonSpawners adds a private identity tag.
  #
  # Leave null to use the built-in default Spawner Essence item.
  item: null

spawner-item:
  # MiniMessage template used for recovered spawner item names.
  # %mob% is replaced with the formatted entity name.
  name: '<gradient:#8A2BE2:#D56BFF><b>%mob% Spawner</b></gradient>'

  # MiniMessage lore for recovered typed spawners.
  # %mob% is available on every line.
  lore:
    - ''
    - '<gray>Places a <white>%mob%</white> spawner.'
    - ''
    - '<dark_gray>Spawner Type:</dark_gray> <white>%mob%</white>'
    - '<dark_gray>Managed by PlexonSpawners</dark_gray>'

messages:
  # Send a chat message when a qualifying Silk Touch break successfully
  # recovers the typed spawner item.
  break-success-enabled: false

  # Send a chat message when a failed Silk Touch break successfully passes the
  # Essence chance roll and Essence is delivered.
  # No message is sent when the chance roll fails.
  break-failed-enabled: false
