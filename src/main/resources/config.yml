# PlexonSpawners 4.0 — WildStacker-authoritative policy layer
# WildStacker owns spawner quantities, persistence, placement, merging, unstacking,
# stack limits, spawner items, tiers/upgrades and normal placed-spawner interaction.
config-version: 12

# Fresh installations are explicitly Survival-scoped. Existing schema-11 configs with an empty
# legacy allowlist migrate to scope.mode=ALL to preserve behavior without silently changing scope.
scope:
  mode: ALLOWLIST
  worlds:
    - Survival_World
    - Survival_World_nether
    - Survival_World_the_end

breaking:
  enabled: true
  required-silk-touch-level: 1
  allow-silk-bypass-permission: false
  non-silk-reward-mode: ESSENCE
  creative:
    recover-spawner: true
    award-essence: true
    award-custom-item: false

essence:
  enabled: true
  default-amount: 1
  default-chance: 35.0
  delivery: INVENTORY
  item:
    # When an exact item is captured, exact-data (Paper serializeAsBytes Base64) becomes authoritative.
    material: AMETHYST_SHARD
    name: '<gradient:#56B9F2:#92E1FF><b>Spawner Essence</b></gradient>'
    lore:
      - '<gray>A concentrated fragment of spawner energy.</gray>'
    glow: true
    item-model: null
  mob-overrides: {}

custom-drop:
  enabled: false
  default-amount: 1
  default-chance: 15.0
  delivery: INVENTORY
  item:
    material: PRISMARINE_CRYSTALS
    name: '<gradient:#7BE7FF:#4AA8FF><b>Spawner Fragment</b></gradient>'
    lore:
      - '<gray>Dropped when a spawner is broken without Silk Touch.</gray>'
      - '<dark_gray>Configurable PlexonSpawners reward.</dark_gray>'
    glow: true
    item-model: null
  mob-overrides: {}

rewards:
  mob-overrides: {}

admin-gui:
  enabled: true
  title: '<gradient:#56B9F2:#92E1FF><b>PlexonSpawners Admin</b></gradient>'
  config-backups-to-keep: 10

messages:
  silk-recovered: true
  essence-awarded: true
  custom-drop-awarded: true
