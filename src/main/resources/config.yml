# PlexonSpawners 4.0 — WildStacker-authoritative policy layer
# WildStacker owns all stacking, stack persistence, placement, merge behavior,
# stack limits, entity stacking, item stacking, and spawner item representation.
config-version: 10

breaking:
  enabled: true
  required-silk-touch-level: 1
  allow-silk-bypass-permission: false

  creative:
    recover-spawner: false
    award-essence: false

  # Empty means all worlds.
  enabled-worlds: []

essence:
  enabled: true
  default-amount: 1
  default-chance: 35.0
  delivery: INVENTORY

  # Example:
  # mob-overrides:
  #   BLAZE:
  #     amount: 2
  #     chance: 25.0
  mob-overrides: {}

gui:
  enabled: true
  open-on-right-click: true
  title: '<gradient:#56B9F2:#92E1FF><b>Spawner Withdrawal</b></gradient>'
  withdraw-presets:
    - 1
    - 8
    - 16
    - 32
    - 64

messages:
  silk-recovered: true
  essence-awarded: true
  withdraw-success: true
  withdraw-failed: true
