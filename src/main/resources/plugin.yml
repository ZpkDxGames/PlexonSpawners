name: PlexonSpawners
version: '${version}'
main: com.plexon.spawners.PlexonSpawners
api-version: '26.2'
author: ZpkDxGames
description: PlexonCraft Silk Touch/Essence spawner recovery and WildStacker withdrawal GUI integration.
prefix: PlexonSpawners

depend:
  - WildStacker

commands:
  pspawners:
    description: PlexonSpawners integration administration.
    usage: /pspawners <status|reload>
    aliases: [plexonspawners, pspawner]
    permission: plexonspawners.admin

permissions:
  plexonspawners.admin:
    description: Base PlexonSpawners administration permission.
    default: op
    children:
      plexonspawners.admin.reload: true
      plexonspawners.admin.status: true
  plexonspawners.admin.reload:
    description: Reload PlexonSpawners 4.0 policy configuration.
    default: op
  plexonspawners.admin.status:
    description: View PlexonSpawners and WildStacker integration status.
    default: op
  plexonspawners.bypass.silk:
    description: Bypass the configured Silk Touch level when the bypass setting is enabled.
    default: false
  plexonspawners.gui:
    description: Open and use the WildStacker spawner withdrawal GUI.
    default: true
