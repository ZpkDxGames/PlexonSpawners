name: PlexonSpawners
version: '${version}'
main: com.plexon.spawners.PlexonSpawners
api-version: '26.2'
author: ZpkDxGames
description: Persistent premium managed spawners, tier upgrades, Essence recovery and first-party spawn provenance.
prefix: PlexonSpawners

softdepend:
  - PlexonCore

# PlexonSpawners intentionally loads before known spawner managers so its
# HIGHEST-priority break listener can claim accepted managed breaks first.
loadbefore:
  - WildStacker

commands:
  pspawners:
    description: PlexonSpawners administration command.
    usage: /pspawners <admin|info|diagnostics|reload|give|essence>
    aliases: [plexonspawners, pspawner]
    permission: plexonspawners.admin

permissions:
  plexonspawners.admin:
    description: Access to PlexonSpawners administration commands and managed-spawner administration.
    default: op
    children:
      plexonspawners.admin.gui: true
      plexonspawners.admin.reload: true
      plexonspawners.admin.give: true
      plexonspawners.admin.essence: true
      plexonspawners.bypass.access: true
  plexonspawners.admin.gui:
    description: Open and use the in-game admin editor.
    default: op
  plexonspawners.admin.reload:
    description: Reload PlexonSpawners configuration.
    default: op
  plexonspawners.admin.give:
    description: Give PlexonSpawners spawner items.
    default: op
  plexonspawners.admin.essence:
    description: Configure or give Spawner Essence.
    default: op
  plexonspawners.bypass.silk:
    description: Bypass the configured Silk Touch level only when breaking.allow-silk-bypass-permission is enabled.
    default: false
  plexonspawners.bypass.access:
    description: Bypass managed-spawner ownership and access restrictions.
    default: false
