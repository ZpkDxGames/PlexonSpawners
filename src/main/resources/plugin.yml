name: PlexonSpawners
version: '${version}'
main: com.plexon.spawners.PlexonSpawners
api-version: '26.2'
author: ZpkDxGames
description: WildStacker-authoritative spawner recovery, rewards and administration for PlexonCraft.
prefix: PlexonSpawners

depend:
  - WildStacker

commands:
  pspawners:
    description: PlexonSpawners administration and integration status.
    usage: /pspawners <admin|status|reload>
    aliases: [plexonspawners, pspawner]
    permission: plexonspawners.admin

permissions:
  plexonspawners.admin:
    description: Base PlexonSpawners administration permission.
    default: op
    children:
      plexonspawners.admin.gui: true
      plexonspawners.admin.reload: true
      plexonspawners.admin.status: true
  plexonspawners.admin.gui:
    description: Open and use the PlexonSpawners policy administration GUI.
    default: op
  plexonspawners.admin.reload:
    description: Reload PlexonSpawners policy configuration.
    default: op
  plexonspawners.admin.status:
    description: View PlexonSpawners and WildStacker integration status.
    default: op
  plexonspawners.bypass.silk:
    description: Bypass the configured Silk Touch level when the bypass setting is enabled.
    default: op
  plexonspawners.gui:
    description: Open and use the WildStacker spawner withdrawal GUI.
    default: true
