name: Publish 4.0 Stable

on:
  workflow_dispatch:
    inputs:
      runtime_certification:
        description: 'PASS only after exact candidate live certification'
        required: true
        type: choice
        options: [PASS, FAIL]
      certified_source_sha:
        description: 'Exact source SHA that produced live-tested candidate'
        required: true
        type: string
      candidate_jar_sha256:
        description: 'SHA-256 of exact live-tested PlexonSpawners-4.0.0.jar'
        required: true
        type: string
      paper_build:
        description: 'Exact certified Paper build'
        required: true
        type: string
      wildstacker_version:
        description: 'Exact production WildStacker version certified'
        required: true
        type: string
      singular_matrix:
        description: 'Full singular/stacked break matrix result'
        required: true
        type: choice
        options: [PASS, FAIL]
      exact_item_roundtrip:
        description: 'Complex exact reward item round-trip result'
        required: true
        type: choice
        options: [PASS, FAIL]
      survival_scope:
        description: 'Survival-only scope runtime result'
        required: true
        type: choice
        options: [PASS, FAIL]
      spark_soak:
        description: 'At least 30-minute Spark/runtime soak result'
        required: true
        type: choice
        options: [PASS, FAIL]
      migration_status:
        description: 'PASS or NOT_REQUIRED, backed by live evidence'
        required: true
        type: choice
        options: [PASS, NOT_REQUIRED]
      old_logical_total:
        description: 'Old Plexon logical total'
        required: true
        type: string
      new_logical_total:
        description: 'New WildStacker logical total'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

env:
  VERSION: '4.0.0'
  RELEASE_TAG: 'v4.0.0'
  BASELINE_STABLE_TAG: 'v3.4.0'
  BASELINE_STABLE_SHA: 'cd9966c79add8c98dcdb389d2fc722ce66d795ec'
  BASELINE_STABLE_JAR_SHA256: '6fd9b6119371820173307853a7b58243ebf1f28e083212dcc6287c01d68f3c58'
  PAPER_BUILD: '26.2.build.121-stable'
  WILDSTACKER_API_VERSION: '2026.2'
  PLEXONCORE_VERSION: '2.1.0'
  PLEXONCORE_SHA256: '7ee823ded87d5be9c62426b04571c0d0d6b11c138575ca2c91838586c9f7576c'

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.runtime_certification == 'PASS' &&
      inputs.singular_matrix == 'PASS' &&
      inputs.exact_item_roundtrip == 'PASS' &&
      inputs.survival_scope == 'PASS' &&
      inputs.spark_soak == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Prove certified source and migration boundary
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SOURCE_SHA: ${{ inputs.certified_source_sha }}
          CANDIDATE_JAR_SHA256: ${{ inputs.candidate_jar_sha256 }}
          CERTIFIED_PAPER: ${{ inputs.paper_build }}
          MIGRATION_STATUS: ${{ inputs.migration_status }}
          OLD_LOGICAL_TOTAL: ${{ inputs.old_logical_total }}
          NEW_LOGICAL_TOTAL: ${{ inputs.new_logical_total }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CERTIFIED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$CERTIFIED_PAPER" = "$PAPER_BUILD"
          [[ "$CANDIDATE_JAR_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$OLD_LOGICAL_TOTAL" =~ ^[0-9]+$ ]]
          [[ "$NEW_LOGICAL_TOTAL" =~ ^[0-9]+$ ]]
          git merge-base --is-ancestor "$BASELINE_STABLE_SHA" "$GITHUB_SHA"

          STABLE_SHA="$(git ls-remote origin refs/heads/release/stable | awk '{print $1}')"
          test "$STABLE_SHA" = "$GITHUB_SHA"

          BUILD_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Build --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$BUILD_RUN_ID"
          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; stable tags are immutable-intent." >&2
            exit 1
          fi

          if [ "$MIGRATION_STATUS" = 'PASS' ]; then
            test "$OLD_LOGICAL_TOTAL" -gt 0
            test "$OLD_LOGICAL_TOTAL" = "$NEW_LOGICAL_TOTAL"
          else
            test "$OLD_LOGICAL_TOTAL" = '0'
            test "$NEW_LOGICAL_TOTAL" = '0'
          fi

          test -s ".release/RELEASE_NOTES_${VERSION}.md"
          test -s '.release/RUNTIME_CERTIFICATION_4.0.0.template'
          test -s 'docs/MIGRATION_4_0.md'
          git diff --check

      - name: Rebuild exact certified source
        run: gradle clean test check jar --no-daemon --stacktrace

      - name: Require deterministic hash equality with live-tested candidate
        env:
          CANDIDATE_JAR_SHA256: ${{ inputs.candidate_jar_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          test -s "$JAR"
          REBUILT_SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          test "$(echo "$REBUILT_SHA" | tr '[:upper:]' '[:lower:]')" = "$(echo "$CANDIDATE_JAR_SHA256" | tr '[:upper:]' '[:lower:]')"
          echo "REBUILT_SHA=$REBUILT_SHA" >> "$GITHUB_ENV"

      - name: Prepare immutable stable provenance
        env:
          CERTIFIED_SOURCE_SHA: ${{ inputs.certified_source_sha }}
          CANDIDATE_JAR_SHA256: ${{ inputs.candidate_jar_sha256 }}
          CERTIFIED_PAPER: ${{ inputs.paper_build }}
          WILDSTACKER_VERSION: ${{ inputs.wildstacker_version }}
          MIGRATION_STATUS: ${{ inputs.migration_status }}
          OLD_LOGICAL_TOTAL: ${{ inputs.old_logical_total }}
          NEW_LOGICAL_TOTAL: ${{ inputs.new_logical_total }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          cp "$JAR" build/release-evidence/
          (cd build/release-evidence && sha256sum "PlexonSpawners-${VERSION}.jar" > SHA256SUMS.txt)
          JAR_SIZE="$(stat -c%s "$JAR")"
          cat > build/release-evidence/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          version=$VERSION
          source_sha=$GITHUB_SHA
          certified_source_sha=$CERTIFIED_SOURCE_SHA
          build_run_id=$BUILD_RUN_ID
          java=25
          java_class_major=69
          paper=$CERTIFIED_PAPER
          wildstacker_api=$WILDSTACKER_API_VERSION
          wildstacker_version=$WILDSTACKER_VERSION
          plexoncore=$PLEXONCORE_VERSION
          plexoncore_sha256=$PLEXONCORE_SHA256
          wildstacker_spawner_authority=PASS
          wildstacker_entity_authority=PASS
          wildstacker_item_authority=PASS
          wildstacker_upgrade_authority=PASS
          plexon_native_stacking_absent=PASS
          withdrawal_gui_absent=PASS
          schema12=PASS
          singular_matrix=PASS
          exact_reward_item_roundtrip=PASS
          survival_scope=PASS
          spark_soak=PASS
          migration=$MIGRATION_STATUS
          old_logical_total=$OLD_LOGICAL_TOTAL
          new_logical_total=$NEW_LOGICAL_TOTAL
          runtime_certification=PASS
          candidate_jar_sha256=$CANDIDATE_JAR_SHA256
          rebuilt_jar_sha256=$REBUILT_SHA
          jar_size=$JAR_SIZE
          baseline_tag=$BASELINE_STABLE_TAG
          baseline_sha=$BASELINE_STABLE_SHA
          baseline_jar_sha256=$BASELINE_STABLE_JAR_SHA256
          EOF

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             "build/release-evidence/PlexonSpawners-${VERSION}.jar"             build/release-evidence/SHA256SUMS.txt             build/release-evidence/PROVENANCE.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "PlexonSpawners ${VERSION}"             --notes-file ".release/RELEASE_NOTES_${VERSION}.md"

      - name: Re-download and verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS.txt)
          PUBLIC_SHA="$(sha256sum "published/PlexonSpawners-${VERSION}.jar" | awk '{print $1}')"
          test "$PUBLIC_SHA" = "$REBUILT_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --json tagName,isDraft,isPrerelease,targetCommitish --jq             'select(.tagName == "v4.0.0" and .isDraft == false and .isPrerelease == false)'
