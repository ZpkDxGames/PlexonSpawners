name: Release

on:
  push:
    branches: [release/stable]

permissions:
  contents: write
  actions: read

concurrency:
  group: plexonspawners-stable
  cancel-in-progress: false

env:
  BASELINE_STABLE_TAG: 'v3.1.0'
  BASELINE_STABLE_SHA: '8aaf1b7078edf5e9076af02035d204e123b3958a'
  BASELINE_STABLE_JAR_SHA256: '00281428501747d3ae16304a5e376006bde01a81f69181d4c327a65c71506d65'
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact stable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Resolve stable version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q properties --no-daemon | awk '$1 == "version:" {print $2; exit}')"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Verify exact stable boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" != *-* ]] || { echo 'Stable version must not contain a prerelease suffix.' >&2; exit 1; }
          test "$GITHUB_REF_NAME" = 'release/stable'
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$main_sha"
          git merge-base --is-ancestor "$BASELINE_STABLE_SHA" HEAD
          grep -Fq "CORE_VERSION=\"${CORE_VERSION}\"" scripts/provision-core.sh
          grep -Fq "CORE_SHA256=\"${CORE_SHA256}\"" scripts/provision-core.sh
          test -s ".release/RELEASE_NOTES_${VERSION}.md"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to move a stable tag." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG release already exists; refusing replacement." >&2
            exit 1
          fi

      - name: Rebuild and test exact stable source
        run: gradle clean test check jar --no-daemon

      - name: Build exact test summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths:
              raise SystemExit('No JUnit XML results found')
          for path in paths:
              root = ET.parse(path).getroot()
              totals['tests'] += int(root.attrib.get('tests', 0))
              totals['failures'] += int(root.attrib.get('failures', 0))
              totals['errors'] += int(root.attrib.get('errors', 0))
              totals['skipped'] += int(root.attrib.get('skipped', 0))
          if totals['tests'] <= 0:
              raise SystemExit('No tests executed')
          if totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Non-clean test totals: {totals}')
          pathlib.Path('build/release-evidence/TEST_SUMMARY.txt').write_text(
              f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n",
              encoding='utf-8')
          print(totals)
          PY

      - name: Verify exact distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > build/release-evidence/jar-contents.txt
          for required in \
            plugin.yml \
            config.yml \
            com/plexon/spawners/PlexonSpawners.class \
            com/plexon/spawners/api/PlexonSpawnersApi.class \
            com/plexon/spawners/compat/WildStackerCompat.class \
            com/plexon/spawners/config/NearbyStackCapSettings.class \
            com/plexon/spawners/managed/ManagedSpawnerRegistry.class \
            com/plexon/spawners/managed/SpawnerStateService.class \
            com/plexon/spawners/managed/SpawnerOriginService.class \
            com/plexon/spawners/managed/NearbyStackCapPolicy.class \
            com/plexon/spawners/listener/NearbyStackCapListener.class \
            com/plexon/spawners/listener/SpawnerChunkListener.class \
            com/plexon/spawners/gui/SpawnerControlGui.class; do
            grep -qx "$required" build/release-evidence/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" config.yml | grep -F 'config-version: 6'
          javap -verbose -classpath "$JAR" com.plexon.spawners.PlexonSpawners | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' build/release-evidence/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded.' >&2
            exit 1
          fi
          (cd build/libs && sha256sum "PlexonSpawners-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Build exact release evidence
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          size="$(stat -c%s "$JAR")"
          cat > build/release-evidence/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          version=$VERSION
          java=25
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=$CORE_VERSION
          plexoncore_sha256=$CORE_SHA256
          config_schema=6
          config_defaults_materialized=PASS
          managed_persistence_schema=1
          managed_item_schema=2
          nearby_stack_cap_default_radius=8.0
          nearby_stack_cap_default_maximum=99
          wildstacker_logical_counting=PASS
          wildstacker_direct_stack_guard=PASS
          wildstacker_degradation_unhook=PASS
          stable_baseline_tag=$BASELINE_STABLE_TAG
          stable_baseline_sha=$BASELINE_STABLE_SHA
          stable_baseline_jar_sha256=$BASELINE_STABLE_JAR_SHA256
          jar_size=$size
          jar_sha256=$digest
          unknown_entity_guard=PASS
          managed_identity_reconciliation=PASS
          essence_upgrade_rollback=PASS
          bounded_persistence_writer=PASS
          github_source_certification=PASS
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Publish GitHub stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "build/libs/PlexonSpawners-${VERSION}.jar" \
            build/libs/SHA256SUMS.txt \
            build/release-evidence/TEST_SUMMARY.txt \
            build/release-evidence/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlexonSpawners ${VERSION}" \
            --notes-file ".release/RELEASE_NOTES_${VERSION}.md" \
            --latest

      - name: Verify published stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,targetCommitish,assets > build/release-evidence/release.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('build/release-evidence/release.json', encoding='utf-8'))
          assert data['tagName'] == os.environ['RELEASE_TAG']
          assert data['isPrerelease'] is False
          assert data['targetCommitish'] == os.environ['GITHUB_SHA']
          names={asset['name'] for asset in data['assets']}
          expected={f"PlexonSpawners-{os.environ['VERSION']}.jar", 'SHA256SUMS.txt', 'TEST_SUMMARY.txt', 'PROVENANCE.txt'}
          assert names == expected, (names, expected)
          PY
          rm -rf published
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "PlexonSpawners-${VERSION}.jar" \
            --pattern 'SHA256SUMS.txt' \
            --pattern 'TEST_SUMMARY.txt' \
            --pattern 'PROVENANCE.txt'
          test "$(find published -maxdepth 1 -type f | wc -l)" -eq 4
          (cd published && sha256sum --check SHA256SUMS.txt)
          grep -Fx "repository=$GITHUB_REPOSITORY" published/PROVENANCE.txt
          grep -Fx "source_sha=$GITHUB_SHA" published/PROVENANCE.txt
          grep -Fx "version=$VERSION" published/PROVENANCE.txt
          grep -Fx 'config_schema=6' published/PROVENANCE.txt
          grep -Fx 'config_defaults_materialized=PASS' published/PROVENANCE.txt
          grep -Fx 'managed_persistence_schema=1' published/PROVENANCE.txt
          grep -Fx 'managed_item_schema=2' published/PROVENANCE.txt
          grep -Fx 'nearby_stack_cap_default_radius=8.0' published/PROVENANCE.txt
          grep -Fx 'nearby_stack_cap_default_maximum=99' published/PROVENANCE.txt
          grep -Fx 'wildstacker_logical_counting=PASS' published/PROVENANCE.txt
          grep -Fx 'wildstacker_direct_stack_guard=PASS' published/PROVENANCE.txt
          grep -Fx 'wildstacker_degradation_unhook=PASS' published/PROVENANCE.txt
          grep -Fx "stable_baseline_tag=$BASELINE_STABLE_TAG" published/PROVENANCE.txt
          grep -Fx "stable_baseline_sha=$BASELINE_STABLE_SHA" published/PROVENANCE.txt
          grep -Fx "stable_baseline_jar_sha256=$BASELINE_STABLE_JAR_SHA256" published/PROVENANCE.txt
          grep -Fx 'unknown_entity_guard=PASS' published/PROVENANCE.txt
          grep -Fx 'managed_identity_reconciliation=PASS' published/PROVENANCE.txt
          grep -Fx 'essence_upgrade_rollback=PASS' published/PROVENANCE.txt
          grep -Fx 'bounded_persistence_writer=PASS' published/PROVENANCE.txt
          grep -Fx 'github_source_certification=PASS' published/PROVENANCE.txt
          grep -Fx 'runtime_certification=NOT_EXECUTED' published/PROVENANCE.txt
          grep -Eq '^TEST_COUNT=[1-9][0-9]* FAILURES=0 ERRORS=0 SKIPPED=0$' published/TEST_SUMMARY.txt

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSpawners-release-${{ github.sha }}
          path: |
            published/PlexonSpawners-*.jar
            published/SHA256SUMS.txt
            published/TEST_SUMMARY.txt
            published/PROVENANCE.txt
          if-no-files-found: error
