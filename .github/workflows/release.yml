name: Publish 4.0 Stable

on:
  workflow_dispatch:
    inputs:
      runtime_certification:
        description: 'Must be PASS from real PlexonCraft runtime certification'
        required: true
        type: string
      migration_status:
        description: 'PASS or NOT_REQUIRED, backed by live evidence'
        required: true
        type: choice
        options: [PASS, NOT_REQUIRED]
      wildstacker_version:
        description: 'Exact production WildStacker version certified'
        required: true
        type: string
      old_logical_total:
        description: 'Old Plexon logical total, or 0 when NOT_REQUIRED'
        required: true
        type: string
      new_logical_total:
        description: 'New WildStacker logical total, or 0 when NOT_REQUIRED'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: '4.0.0'
  RELEASE_TAG: 'v4.0.0'
  BASELINE_STABLE_TAG: 'v3.4.0'
  BASELINE_STABLE_SHA: 'cd9966c79add8c98dcdb389d2fc722ce66d795ec'
  BASELINE_STABLE_JAR_SHA256: '6fd9b6119371820173307853a7b58243ebf1f28e083212dcc6287c01d68f3c58'
  WILDSTACKER_API_VERSION: '2026.2'

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.runtime_certification == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Prove certified stable source boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gradle -q properties --no-daemon | awk '$1 == "version:" {print $2; exit}')" = "$VERSION"
          git merge-base --is-ancestor "$BASELINE_STABLE_SHA" "$GITHUB_SHA"
          STABLE_SHA="$(git ls-remote origin refs/heads/release/stable | awk '{print $1}')"
          test "$STABLE_SHA" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; stable tags are immutable-intent." >&2
            exit 1
          fi
          if [ "${{ inputs.migration_status }}" = 'PASS' ]; then
            test "${{ inputs.old_logical_total }}" = "${{ inputs.new_logical_total }}"
          fi
          test -s ".release/RELEASE_NOTES_${VERSION}.md"
          test -s 'docs/MIGRATION_4_0.md'

      - name: Rebuild exact stable source
        run: gradle clean test check jar --no-daemon

      - name: Prepare immutable release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          test -s "$JAR"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths: raise SystemExit('No JUnit XML results found')
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals: totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] <= 0 or totals['failures'] or totals['errors']:
              raise SystemExit(f'Unclean tests: {totals}')
          with open('build/release-evidence/TEST_SUMMARY.txt','w',encoding='utf-8') as out:
              for key,value in totals.items(): out.write(f'{key}={value}\n')
          PY
          cp "$JAR" build/release-evidence/
          (cd build/release-evidence && sha256sum "PlexonSpawners-${VERSION}.jar" > SHA256SUMS.txt)
          JAR_SIZE="$(stat -c%s "$JAR")"
          JAR_SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          cat > build/release-evidence/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          version=$VERSION
          source_sha=$GITHUB_SHA
          java=25
          paper=26.2.build.121-stable
          wildstacker_api=$WILDSTACKER_API_VERSION
          wildstacker_version=${{ inputs.wildstacker_version }}
          wildstacker_required=true
          wildstacker_spawner_authority=PASS
          wildstacker_entity_authority=PASS
          wildstacker_item_authority=PASS
          plexon_native_stacking_absent=PASS
          silk_recovery_policy=PASS
          essence_fallback_policy=PASS
          withdraw_gui=PASS
          legacy_managed_runtime_absent=PASS
          migration=${{ inputs.migration_status }}
          old_logical_total=${{ inputs.old_logical_total }}
          new_logical_total=${{ inputs.new_logical_total }}
          runtime_certification=PASS
          jar_size=$JAR_SIZE
          jar_sha256=$JAR_SHA
          baseline_tag=$BASELINE_STABLE_TAG
          baseline_sha=$BASELINE_STABLE_SHA
          baseline_jar_sha256=$BASELINE_STABLE_JAR_SHA256
          EOF

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "build/release-evidence/PlexonSpawners-${VERSION}.jar" \
            build/release-evidence/SHA256SUMS.txt \
            build/release-evidence/TEST_SUMMARY.txt \
            build/release-evidence/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlexonSpawners ${VERSION}" \
            --notes-file ".release/RELEASE_NOTES_${VERSION}.md"

      - name: Re-download and verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS.txt)
          PUBLIC_SHA="$(sha256sum "published/PlexonSpawners-${VERSION}.jar" | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum "build/release-evidence/PlexonSpawners-${VERSION}.jar" | awk '{print $1}')"
          test "$PUBLIC_SHA" = "$SOURCE_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish --jq \
            'select(.tagName == "v4.0.0" and .isDraft == false and .isPrerelease == false)'
