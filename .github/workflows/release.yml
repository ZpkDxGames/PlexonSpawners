name: Release

on:
  push:
    tags:
      - 'v2.3.1'

permissions:
  contents: write

env:
  PLUGIN_VERSION: '2.3.1'
  CORE_SHA256: '4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify release tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${PLUGIN_VERSION}"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Provision PlexonCore API 1.0.0
        shell: bash
        run: |
          curl -fsSL -o /tmp/PlexonCore-1.0.0.jar \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar
          echo "${CORE_SHA256}  /tmp/PlexonCore-1.0.0.jar" | sha256sum --check
          mvn -B install:install-file \
            -Dfile=/tmp/PlexonCore-1.0.0.jar \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build exact release
        run: gradle clean check --stacktrace

      - name: Prepare checksums
        shell: bash
        run: |
          mkdir -p build/release
          cp "build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar" "build/release/PlexonSpawners-${PLUGIN_VERSION}.jar"
          (cd build/release && sha256sum "PlexonSpawners-${PLUGIN_VERSION}.jar") > build/release/SHA256SUMS.txt
          (cd build/release && sha256sum --check SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${PLUGIN_VERSION}"
          JAR="build/release/PlexonSpawners-${PLUGIN_VERSION}.jar"
          SUMS="build/release/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SUMS" --clobber
          else
            gh release create "$TAG" "$JAR" "$SUMS" \
              --target "$GITHUB_SHA" \
              --title "PlexonSpawners ${PLUGIN_VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
