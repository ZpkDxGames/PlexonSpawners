name: Prerelease

on:
  push:
    branches: [release/candidate]
  workflow_dispatch:

permissions:
  contents: write

env:
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
  STABLE_ROLLBACK_TAG: 'v3.0.0'
  STABLE_ROLLBACK_SHA: 'df5ba1970add67a46dc1afc0d844578144a88df1'
  STABLE_ROLLBACK_JAR_SHA256: '61978a50fcc39ccb2b025e2fe4b49ca8c28b2e849bdd9fb9d0eab9d89771e564'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Prove exact current main candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          VERSION="$(gradle -q properties --no-daemon | awk '$1 == "version:" {print $2; exit}')"
          test -n "$VERSION"
          case "$VERSION" in
            *-rc.*) ;;
            *) echo "Prerelease workflow requires an -rc. version, found $VERSION" >&2; exit 1 ;;
          esac
          test -f ".release/RELEASE_NOTES_${VERSION}.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Refuse tag or release replacement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to move or replace it." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to replace it." >&2
            exit 1
          fi

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Verify PlexonCore pin
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "CORE_VERSION=\"${CORE_VERSION}\"" scripts/provision-core.sh
          grep -Fq "CORE_SHA256=\"${CORE_SHA256}\"" scripts/provision-core.sh

      - name: Full candidate verification
        run: gradle clean test check jar --no-daemon

      - name: Build release evidence
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          test -s "$JAR"
          mkdir -p build/release-evidence
          jar tf "$JAR" > build/release-evidence/jar-contents.txt
          for required in \
            plugin.yml \
            config.yml \
            com/plexon/spawners/PlexonSpawners.class \
            com/plexon/spawners/compat/WildStackerCompat.class \
            com/plexon/spawners/config/NearbyStackCapSettings.class \
            com/plexon/spawners/managed/NearbyStackCapPolicy.class \
            com/plexon/spawners/listener/NearbyStackCapListener.class; do
            grep -qx "$required" build/release-evidence/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" config.yml | grep -F 'config-version: 6'
          javap -verbose -classpath "$JAR" com.plexon.spawners.PlexonSpawners | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' build/release-evidence/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths:
              raise SystemExit('No JUnit XML results found')
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] <= 0 or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Non-clean test totals: {totals}')
          pathlib.Path('build/release-evidence/TEST_SUMMARY.txt').write_text(
              f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n",
              encoding='utf-8')
          print(totals)
          PY

          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          size="$(stat -c%s "$JAR")"
          printf '%s  %s\n' "$digest" "$(basename "$JAR")" > build/release-evidence/SHA256SUMS.txt
          (cd build/libs && sha256sum "PlexonSpawners-${VERSION}.jar")
          cat > build/release-evidence/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          version=$VERSION
          java=25
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=$CORE_VERSION
          plexoncore_sha256=$CORE_SHA256
          config_schema=6
          managed_persistence_schema=1
          managed_item_schema=2
          nearby_stack_cap_default_radius=8.0
          nearby_stack_cap_default_maximum=99
          wildstacker_logical_counting=PASS
          wildstacker_direct_stack_guard=PASS
          stable_rollback_tag=$STABLE_ROLLBACK_TAG
          stable_rollback_sha=$STABLE_ROLLBACK_SHA
          stable_rollback_jar_sha256=$STABLE_ROLLBACK_JAR_SHA256
          jar_size=$size
          jar_sha256=$digest
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          gh release create "$TAG" \
            "$JAR" \
            build/release-evidence/SHA256SUMS.txt \
            build/release-evidence/TEST_SUMMARY.txt \
            build/release-evidence/PROVENANCE.txt \
            --target "$GITHUB_SHA" \
            --title "PlexonSpawners ${TAG}" \
            --notes-file ".release/RELEASE_NOTES_${VERSION}.md" \
            --prerelease

      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "true"
          test "$(gh release view "$TAG" --json tagName --jq .tagName)" = "$TAG"
          mkdir -p build/public-release
          gh release download "$TAG" --dir build/public-release
          for asset in \
            "PlexonSpawners-${VERSION}.jar" \
            SHA256SUMS.txt \
            TEST_SUMMARY.txt \
            PROVENANCE.txt; do
            test -s "build/public-release/$asset"
          done
          (cd build/public-release && sha256sum --check SHA256SUMS.txt)
          cmp "build/libs/PlexonSpawners-${VERSION}.jar" "build/public-release/PlexonSpawners-${VERSION}.jar"
          grep -Fx "source_sha=$GITHUB_SHA" build/public-release/PROVENANCE.txt
          grep -Fx 'runtime_certification=NOT_EXECUTED' build/public-release/PROVENANCE.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSpawners-${{ github.sha }}-prerelease-evidence
          path: |
            build/libs/PlexonSpawners-${{ env.VERSION }}.jar
            build/release-evidence/SHA256SUMS.txt
            build/release-evidence/TEST_SUMMARY.txt
            build/release-evidence/PROVENANCE.txt
          if-no-files-found: error
