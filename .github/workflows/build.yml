name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_STABLE_TAG: 'v3.4.0'
  BASELINE_STABLE_SHA: 'cd9966c79add8c98dcdb389d2fc722ce66d795ec'
  BASELINE_STABLE_JAR_SHA256: '6fd9b6119371820173307853a7b58243ebf1f28e083212dcc6287c01d68f3c58'
  WILDSTACKER_API_VERSION: '2026.2'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify release lineage and source boundary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q properties --no-daemon | awk '$1 == "version:" {print $2; exit}')"
          test "$VERSION" = '4.0.0'
          git merge-base --is-ancestor "$BASELINE_STABLE_SHA" HEAD
          grep -Fq "WildStackerAPI:$WILDSTACKER_API_VERSION" build.gradle.kts
          test ! -d src/main/java/com/plexon/spawners/managed
          test ! -d src/main/java/com/plexon/spawners/compat
          ! grep -R "Class.forName\|java.lang.reflect" src/main/java/com/plexon/spawners
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Full source verification
        run: gradle clean test check jar --no-daemon

      - name: Build test and distribution evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths:
              raise SystemExit('No JUnit XML results found')
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] <= 0 or totals['failures'] or totals['errors']:
              raise SystemExit(f'Unclean tests: {totals}')
          with open('build/release-evidence/TEST_SUMMARY.txt', 'w', encoding='utf-8') as out:
              for key, value in totals.items(): out.write(f'{key}={value}\n')
          PY
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > build/release-evidence/jar-contents.txt
          ! grep -E 'com/plexon/spawners/(managed|compat|api|integration/core)/' build/release-evidence/jar-contents.txt
          ! grep -E '^com/bgsoftware/wildstacker/' build/release-evidence/jar-contents.txt
          sha256sum "$JAR" | tee build/release-evidence/SHA256SUMS.txt

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSpawners-${{ env.VERSION }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/libs/PlexonSpawners-${{ env.VERSION }}.jar
            build/release-evidence/TEST_SUMMARY.txt
            build/release-evidence/SHA256SUMS.txt
            build/release-evidence/jar-contents.txt
