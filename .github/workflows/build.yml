name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_STABLE_TAG: 'v3.1.0'
  BASELINE_STABLE_SHA: '8aaf1b7078edf5e9076af02035d204e123b3958a'
  BASELINE_STABLE_JAR_SHA256: '00281428501747d3ae16304a5e376006bde01a81f69181d4c327a65c71506d65'
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Provision verified PlexonCore API
        run: bash scripts/provision-core.sh

      - name: Resolve version and prove stable lineage
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q properties --no-daemon | awk '$1 == "version:" {print $2; exit}')"
          test -n "$VERSION"
          git merge-base --is-ancestor "$BASELINE_STABLE_SHA" HEAD
          grep -Fq "CORE_VERSION=\"${CORE_VERSION}\"" scripts/provision-core.sh
          grep -Fq "CORE_SHA256=\"${CORE_SHA256}\"" scripts/provision-core.sh
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Full source verification
        run: gradle clean test check jar --no-daemon

      - name: Build exact test summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths:
              raise SystemExit('No JUnit XML results found')
          for path in paths:
              root = ET.parse(path).getroot()
              totals['tests'] += int(root.attrib.get('tests', 0))
              totals['failures'] += int(root.attrib.get('failures', 0))
              totals['errors'] += int(root.attrib.get('errors', 0))
              totals['skipped'] += int(root.attrib.get('skipped', 0))
          if totals['tests'] <= 0:
              raise SystemExit('No tests executed')
          if totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Non-clean test totals: {totals}')
          pathlib.Path('build/release-evidence/TEST_SUMMARY.txt').write_text(
              f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n",
              encoding='utf-8')
          print(totals)
          PY

      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > build/release-evidence/jar-contents.txt
          for required in \
            plugin.yml \
            config.yml \
            com/plexon/spawners/PlexonSpawners.class \
            com/plexon/spawners/api/PlexonSpawnersApi.class \
            com/plexon/spawners/compat/WildStackerCompat.class \
            com/plexon/spawners/config/NearbyStackCapSettings.class \
            com/plexon/spawners/managed/ManagedSpawnerRegistry.class \
            com/plexon/spawners/managed/SpawnerStateService.class \
            com/plexon/spawners/managed/SpawnerOriginService.class \
            com/plexon/spawners/managed/NearbyStackCapPolicy.class \
            com/plexon/spawners/listener/NearbyStackCapListener.class \
            com/plexon/spawners/listener/SpawnerChunkListener.class \
            com/plexon/spawners/gui/SpawnerControlGui.class; do
            grep -qx "$required" build/release-evidence/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" config.yml | grep -F 'config-version: 6'
          javap -verbose -classpath "$JAR" com.plexon.spawners.PlexonSpawners | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' build/release-evidence/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded.' >&2
            exit 1
          fi
          (cd build/libs && sha256sum "PlexonSpawners-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Write exact provenance
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSpawners-${VERSION}.jar"
          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          size="$(stat -c%s "$JAR")"
          cat > build/release-evidence/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          version=$VERSION
          java=25
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=$CORE_VERSION
          plexoncore_sha256=$CORE_SHA256
          config_schema=6
          config_defaults_materialized=PASS
          managed_persistence_schema=1
          managed_item_schema=2
          nearby_stack_cap_default_radius=8.0
          nearby_stack_cap_default_maximum=99
          wildstacker_logical_counting=PASS
          wildstacker_direct_stack_guard=PASS
          wildstacker_degradation_unhook=PASS
          stable_baseline_tag=$BASELINE_STABLE_TAG
          stable_baseline_sha=$BASELINE_STABLE_SHA
          stable_baseline_jar_sha256=$BASELINE_STABLE_JAR_SHA256
          jar_size=$size
          jar_sha256=$digest
          unknown_entity_guard=PASS
          managed_identity_reconciliation=PASS
          essence_upgrade_rollback=PASS
          bounded_persistence_writer=PASS
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Check source whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$(git merge-base HEAD origin/main)" HEAD

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSpawners-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            build/libs/PlexonSpawners-${{ steps.meta.outputs.version }}.jar
            build/libs/SHA256SUMS.txt
            build/release-evidence/TEST_SUMMARY.txt
            build/release-evidence/PROVENANCE.txt
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: build/test-results/test/
