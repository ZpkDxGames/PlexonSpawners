name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plexonspawners-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_VERSION: '2.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build PlexonSpawners
        run: gradle clean build --stacktrace

      - name: Verify runtime JAR
        shell: bash
        run: |
          test -f "build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar"
          jar tf "build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar" | grep -q '^plugin.yml$'
          jar tf "build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar" | grep -q '^com/plexon/spawners/PlexonSpawners.class$'
          sha256sum "build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSpawners-${{ env.PLUGIN_VERSION }}
          path: build/libs/PlexonSpawners-${{ env.PLUGIN_VERSION }}.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${PLUGIN_VERSION}"
          JAR="build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "PlexonSpawners ${PLUGIN_VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
