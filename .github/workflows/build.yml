name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plexonspawners-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_VERSION: '2.2.0'
  CORE_SHA256: '4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Provision PlexonCore API 1.0.0
        shell: bash
        run: |
          curl -fsSL -o /tmp/PlexonCore-1.0.0.jar \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar
          echo "${CORE_SHA256}  /tmp/PlexonCore-1.0.0.jar" | sha256sum --check
          mvn -B install:install-file \
            -Dfile=/tmp/PlexonCore-1.0.0.jar \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and verify PlexonSpawners
        run: gradle clean check --stacktrace

      - name: Verify runtime JAR contract
        shell: bash
        run: |
          JAR="build/libs/PlexonSpawners-${PLUGIN_VERSION}.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^com/plexon/spawners/PlexonSpawners.class$'
          jar tf "$JAR" | grep -q '^com/plexon/spawners/event/PlexonSpawnerRecoveredEvent.class$'
          jar tf "$JAR" | grep -q '^com/plexon/spawners/event/PlexonSpawnerEssenceAwardedEvent.class$'
          jar tf "$JAR" | grep -q '^com/plexon/spawners/event/PlexonSpawnerPlacedEvent.class$'
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo 'PlexonCore classes were shaded into the plugin JAR.' >&2
            exit 1
          fi
          rm -rf build/release
          mkdir -p build/release
          cp "$JAR" "build/release/PlexonSpawners-${PLUGIN_VERSION}.jar"
          (cd build/release && sha256sum "PlexonSpawners-${PLUGIN_VERSION}.jar") > build/release/SHA256SUMS.txt
          (cd build/release && sha256sum --check SHA256SUMS.txt)

      - name: Check whitespace
        run: git diff --check

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSpawners-${{ env.PLUGIN_VERSION }}
          path: build/release/
          if-no-files-found: error

  release-tag:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: PlexonSpawners 2.2.0')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified build assets
        uses: actions/download-artifact@v4
        with:
          name: PlexonSpawners-${{ env.PLUGIN_VERSION }}
          path: release-assets

      - name: Verify downloaded release assets
        shell: bash
        run: |
          JAR="release-assets/PlexonSpawners-${PLUGIN_VERSION}.jar"
          SUMS="release-assets/SHA256SUMS.txt"
          test -f "$JAR"
          test -f "$SUMS"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Create v2.2.0 tag after successful main verification
        shell: bash
        run: |
          TAG="v${PLUGIN_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; leaving it unchanged."
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${PLUGIN_VERSION}"
          JAR="release-assets/PlexonSpawners-${PLUGIN_VERSION}.jar"
          SUMS="release-assets/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" "$SUMS" --clobber
          else
            gh release create "$TAG" "$JAR" "$SUMS" \
              --target "$GITHUB_SHA" \
              --title "PlexonSpawners ${PLUGIN_VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
